name: Deploy to GKE

run-name: Deploy ${{ github.sha }} to production

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm deployment to production"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'hta-platform-prod' }}
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER_NAME || 'production-cluster' }}
  GKE_LOCATION: ${{ vars.GKE_LOCATION || 'asia-south1-b' }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION || 'asia-south1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'production-docker' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'hta-platform' }}
  CLOUD_SQL_INSTANCE: ${{ vars.CLOUD_SQL_INSTANCE || 'hta-platform-prod:asia-south1:production-postgres' }}
  API_HEALTH_URL: ${{ vars.API_HEALTH_URL || secrets.API_HEALTH_URL }}

jobs:
  preflight:
    name: Validate Production Request
    runs-on: ubuntu-latest
    steps:
      - name: Require main and explicit confirmation
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production deployments must run from the main branch." >&2
            exit 1
          fi
          if [[ "${{ inputs.confirm_production }}" != "true" ]]; then
            echo "Production confirmation was not provided." >&2
            exit 1
          fi
      - name: Validate deployment configuration
        run: |
          for value in PROJECT_ID GKE_CLUSTER GKE_LOCATION GAR_LOCATION GAR_REPOSITORY K8S_NAMESPACE CLOUD_SQL_INSTANCE; do
            if [[ -z "${!value}" ]]; then
              echo "${value} is not configured." >&2
              exit 1
            fi
          done

  build-push:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: API, image: hta-api, dockerfile: apps/api/Dockerfile, target: runner, cache_scope: api }
          - { name: Worker, image: hta-worker, dockerfile: apps/worker/Dockerfile, target: runner, cache_scope: worker }
          - { name: Web, image: hta-web, dockerfile: apps/web-hta/Dockerfile, target: runner, cache_scope: web }
          - { name: Database migrator, image: hta-migrate, dockerfile: apps/api/Dockerfile, target: migrator, cache_scope: migrate }
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GAR_LOCATION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  deploy:
    name: Migrate and Deploy Production
    runs-on: ubuntu-latest
    needs: build-push
    environment:
      name: production
      url: https://hta-calibration.com
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
      - uses: imranismail/setup-kustomize@v2
      - name: Verify cluster access and prerequisites
        run: |
          kubectl get namespace "${K8S_NAMESPACE}"
          kubectl -n "${K8S_NAMESPACE}" get secret api-secrets
          kubectl auth can-i create jobs.batch -n "${K8S_NAMESPACE}" | grep -qx yes
          kubectl auth can-i patch deployments.apps -n "${K8S_NAMESPACE}" | grep -qx yes
      - name: Run database migrations
        env:
          MIGRATION_IMAGE: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/hta-migrate:${{ github.sha }}
        run: |
          command -v envsubst >/dev/null
          kubectl -n "${K8S_NAMESPACE}" delete job hta-db-migrate --ignore-not-found --wait=true
          envsubst < infra/k8s/jobs/db-migrate.yaml | kubectl apply -f -
          if ! kubectl -n "${K8S_NAMESPACE}" wait --for=condition=complete job/hta-db-migrate --timeout=600s; then
            kubectl -n "${K8S_NAMESPACE}" logs job/hta-db-migrate --all-containers=true || true
            kubectl -n "${K8S_NAMESPACE}" describe job hta-db-migrate || true
            exit 1
          fi
          kubectl -n "${K8S_NAMESPACE}" logs job/hta-db-migrate --all-containers=true
      - name: Render production manifests with immutable images
        run: |
          cd infra/k8s/overlays/production
          kustomize edit set image \
            hta-api="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/hta-api:${GITHUB_SHA}" \
            hta-worker="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/hta-worker:${GITHUB_SHA}" \
            hta-web="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/hta-web:${GITHUB_SHA}"
          kustomize build . > "${RUNNER_TEMP}/production.yaml"
      - name: Apply application manifests
        id: apply
        run: |
          echo "started=true" >> "${GITHUB_OUTPUT}"
          kubectl apply -f "${RUNNER_TEMP}/production.yaml"
          change_cause="GitHub ${{ github.repository }} commit ${{ github.sha }} run ${{ github.run_id }}"
          for deployment in hta-api hta-worker hta-web; do
            kubectl -n "${K8S_NAMESPACE}" annotate deployment/${deployment} kubernetes.io/change-cause="${change_cause}" --overwrite
            kubectl -n "${K8S_NAMESPACE}" rollout status deployment/${deployment} --timeout=600s
          done
      - name: Verify deployed workloads
        run: |
          kubectl -n "${K8S_NAMESPACE}" get deployments hta-api hta-worker hta-web -o wide
          kubectl -n "${K8S_NAMESPACE}" get pods -o wide
          if [[ -n "${API_HEALTH_URL}" ]]; then
            curl --fail --show-error --silent --retry 12 --retry-delay 5 --retry-all-errors "${API_HEALTH_URL}"
          else
            echo "API_HEALTH_URL is not configured; rollout readiness is the health gate."
          fi
      - name: Roll back application deployments on failure
        if: failure() && steps.apply.outputs.started == 'true'
        run: |
          for deployment in hta-api hta-worker hta-web; do
            kubectl -n "${K8S_NAMESPACE}" rollout undo deployment/${deployment} || true
          done
      - name: Collect failure diagnostics
        if: failure()
        run: |
          kubectl -n "${K8S_NAMESPACE}" get deployments,pods,jobs -o wide || true
          kubectl -n "${K8S_NAMESPACE}" get events --sort-by=.lastTimestamp | tail -n 100 || true
      - name: Write deployment summary
        if: success()
        run: |
          {
            echo "## Production deployment complete"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Cluster: ${GKE_CLUSTER}"
            echo "- Namespace: ${K8S_NAMESPACE}"
            echo "- Images use immutable ${GITHUB_SHA} tags"
            echo "- Database migrations: complete"
          } >> "${GITHUB_STEP_SUMMARY}"
