apiVersion: v1
kind: ConfigMap
metadata:
  name: hta-config
  namespace: hta-platform
  labels:
    app.kubernetes.io/name: hta-platform
data:
  # CORS configuration
  CORS_ORIGINS: "https://app.hta.example.com"

  # GCS bucket for existing certificate artifacts
  GCS_BUCKET: "hta-certificates-prod"

  # GCS bucket for certificate image uploads
  GCS_CERTIFICATE_IMAGES_BUCKET: "hta-platform-prod-certificate-images"

  # GCS bucket for authorized signed certificate PDFs
  GCS_SIGNED_CERTIFICATES_BUCKET: "hta-platform-prod-signed-certificates"

  # GCS bucket for master instrument certificate PDFs
  GCS_MASTER_INSTRUMENT_CERTIFICATES_BUCKET: "hta-platform-prod-master-instruments"

  # GCS bucket for master instrument training evidence PDFs
  GCS_TRAINING_EVIDENCE_BUCKET: "hta-platform-prod-training-evidence"

  # GCS bucket for chat attachments
  GCS_CHAT_ATTACHMENTS_BUCKET: "hta-platform-prod-chat-attachments"

  # Email configuration
  EMAIL_FROM: "HTA Calibration <noreply@hta-calibration.com>"

  # Logging level
  LOG_LEVEL: "info"

  # Frontend configuration
  APP_URL: "https://hta-calibration.com"
  NEXTAUTH_URL: "https://app.hta.example.com"
  API_URL: "https://api.hta.example.com"

  # WireGuard VPN
  WG_SERVER_ENDPOINT: "35.200.149.46:51820"
  WG_DNS: "10.100.0.1"
  WG_PEERS_BUCKET: "hta-platform-prod-wireguard"
