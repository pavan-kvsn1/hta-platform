apiVersion: batch/v1
kind: Job
metadata:
  name: hta-db-migrate
  namespace: hta-platform
  labels:
    app.kubernetes.io/name: hta-db-migrate
    app.kubernetes.io/component: database-migration
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hta-db-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: api
      containers:
        - name: migrate
          image: ${MIGRATION_IMAGE}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLOUD_SQL_INSTANCE
              value: "${CLOUD_SQL_INSTANCE}"
          envFrom:
            - secretRef:
                name: api-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
