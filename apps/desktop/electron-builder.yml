appId: com.htaipl.calibr8s
productName: HTA Calibration
copyright: Copyright (c) 2026 HTA Calibration

win:
  target:
    - nsis
    - msiWrapped
  icon: ./resources/icon.ico

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  # Install WireGuard silently before the app files are laid down.
  # WireGuard must be per-machine so the tunnel service can run as SYSTEM.
  include: resources/installer-extras.nsh

msiWrapped:
  perMachine: true
  wrappedInstallerArgs: /S
  warningsAsErrors: false

directories:
  output: release

afterPack: scripts/after-pack.js

files:
  - dist/**/*
  - "!dist/migrations/**/*"
  - "!src"

extraResources:
  - from: dist/migrations
    to: migrations
    filter:
      - "**/*.sql"

asarUnpack:
  - dist/migrations/**/*
  - node_modules/@journeyapps/sqlcipher/**/*

publish:
  provider: generic
  url: https://storage.googleapis.com/hta-platform-prod-desktop-releases
